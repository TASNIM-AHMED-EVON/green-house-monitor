<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://i.ibb.co.com/35WZc6zz/ryster.png">
<title>Smart Room Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
:root {
  --bg-base:      #0a0b0f;
  --bg-surface:   #13151b;
  --bg-surface-2: #1a1d24;
  --border:       #22252c;
  --border-soft:  #1a1c22;
  --text:         #e8e8ec;
  --text-dim:     #65656f;
  --text-faint:   #3d3d45;
  --teal:         #2dd4bf;
  --teal-dim:     #0f3d38;
  --orange:       #f97316;
  --sky:          #38bdf8;
  --violet:       #a78bfa;
  --red:          #f87171;
  --radius-sm: 9px;
  --radius-md: 13px;
  --radius-lg: 16px;
  --ease: cubic-bezier(.16,.84,.44,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

html { background: var(--bg-base); }

body {
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.045) 1px, transparent 0) 0 0/22px 22px,
    var(--bg-base);
  color: var(--text);
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  padding: 22px;
  min-height: 100vh;
  font-size: 14px;
}

.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

a { color: inherit; }
button, input { font-family: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* ── Header ─────────────────────────────── */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border-soft);
}
.brand { display: flex; align-items: center; gap: 10px; }
.chip-mark {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--teal);
  flex-shrink: 0;
}
.chip-mark svg { width: 16px; height: 16px; }
.header h1 { font-size: 16px; font-weight: 600; color: #fff; letter-spacing: -.01em; }
.header .sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.live { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-dim); margin-top: 6px; }
.live .mono { letter-spacing: .01em; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); animation: pulse 2s ease-in-out infinite; }
.dot.offline { background: var(--text-faint); box-shadow: none; animation: none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
@keyframes glow { 0%,100%{opacity:1} 50%{opacity:.55} }

.mode-btn {
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: .01em;
  transition: transform .15s var(--ease), opacity .15s;
}
.mode-btn:hover { transform: translateY(-1px); opacity: .92; }
.mode-btn:active { transform: translateY(0); }
.mode-btn.auto   { background: #16253d; color: var(--sky); border-color: #1e3a5f; }
.mode-btn.manual { background: #241a3d; color: var(--violet); border-color: #382a5c; }

/* ── Sensor cards ───────────────────────── */
.sensor-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.sensor-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-top: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  transition: transform .18s var(--ease), border-color .18s;
}
.sensor-card:hover { transform: translateY(-2px); }
#sc-temp { border-top-color: var(--orange); }
#sc-hum  { border-top-color: var(--sky); }
#sc-aq   { border-top-color: var(--violet); }
.sensor-card .lbl {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .09em;
  margin-bottom: 9px;
  font-weight: 500;
}
.sensor-card .val { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.sensor-card .unit { font-size: 11px; color: var(--text-dim); margin-left: 3px; font-family: 'Space Grotesk', sans-serif; }
#sc-temp .val { color: var(--orange); }
#sc-hum  .val { color: var(--sky); }
#sc-aq   .val { color: var(--violet); }
.occ-badge {
  display: inline-block;
  padding: 4px 13px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 500;
  margin-top: 6px;
}
.occ-badge.occupied { background: #0f2e1c; color: #4ade80; }
.occ-badge.empty    { background: var(--bg-surface-2); color: var(--text-dim); border: 1px solid var(--border); }
.occ-badge.alarm    { background: #3d1414; color: #fca5a5; animation: pulse 1s infinite; }
.door-timer { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 6px; }
.door-timer.alarm { color: #fca5a5; font-weight: 600; }

/* ── Control panel ──────────────────────── */
.ctrl-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  margin-bottom: 16px;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.03) 1px, transparent 0);
  background-size: 16px 16px;
}
.ctrl-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.ctrl-header span:first-child {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .09em;
  font-weight: 500;
}
.mode-pill {
  font-size: 11px;
  padding: 4px 11px;
  border-radius: 99px;
  font-weight: 500;
}
.mode-pill.auto   { background: #16253d; color: var(--sky); }
.mode-pill.manual { background: #241a3d; color: var(--violet); }

.device-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 10px;
}
.device-card {
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: border-color .2s, transform .18s var(--ease);
}
.device-card:hover { transform: translateY(-1px); }
.device-card.is-on { border-color: #1a6a45; }
.device-name-row { display: flex; align-items: center; gap: 8px; }
.led-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-faint);
  flex-shrink: 0;
  transition: background .2s, box-shadow .2s;
}
.led-dot.on { background: #4ade80; box-shadow: 0 0 6px #4ade80, 0 0 2px #4ade80; animation: glow 1.6s ease-in-out infinite; }
.device-name  { font-size: 13px; font-weight: 500; color: var(--text); }
.device-state { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text-dim); margin-top: 4px; letter-spacing: .03em; }
.device-state.on { color: #4ade80; }

/* toggle switch */
.toggle-wrap { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle-wrap input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0;
  background: var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
}
.toggle-track::before {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  left: 3px; top: 3px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: transform .2s var(--ease), background .2s;
}
.toggle-wrap input:checked ~ .toggle-track { background: #16a34a; }
.toggle-wrap input:checked ~ .toggle-track::before { transform: translateX(18px); background: #fff; }
.toggle-wrap.disabled .toggle-track { opacity: .35; cursor: not-allowed; }

.door-override-row {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border-soft);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.door-override-row .lbl-inline {
  font-size: 10px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: .09em; font-weight: 500;
}

/* ── Charts ─────────────────────────────── */
.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 560px) { .chart-row { grid-template-columns: 1fr; } }
.chart-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
}
.chart-card h2 {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .09em;
  margin-bottom: 12px;
  font-weight: 500;
}
canvas { max-height: 180px; }

/* ── Alert banner ───────────────────────── */
.alert-banner {
  display: none;
  background: #34140a;
  border: 1px solid #c2410c;
  border-radius: var(--radius-sm);
  padding: 11px 16px;
  font-size: 13px;
  color: #fed7aa;
  margin-bottom: 16px;
}
.alert-banner.show { display: block; }

@media (max-width: 480px) {
  body { padding: 14px; }
  .header h1 { font-size: 15px; }
  .sensor-card .val { font-size: 22px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="brand">
    <div class="chip-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <h1>Smart Room Monitor</h1>
      <div class="live">
        <div class="dot offline" id="live-dot"></div>
        <span class="mono" id="live-label">Waiting for ESP32…</span>
      </div>
    </div>
  </div>
  <button class="mode-btn auto" id="mode-btn" onclick="toggleMode()">Auto mode</button>
</div>

<!-- Alert banner -->
<div class="alert-banner" id="alert-banner"></div>

<!-- Sensor cards -->
<div class="sensor-cards">
  <div class="sensor-card" id="sc-temp">
    <div class="lbl">Temperature</div>
    <div class="val" id="v-temp">--<span class="unit">°C</span></div>
  </div>
  <div class="sensor-card" id="sc-hum">
    <div class="lbl">Humidity</div>
    <div class="val" id="v-hum">--<span class="unit">%</span></div>
  </div>
  <div class="sensor-card" id="sc-aq">
    <div class="lbl">Air quality</div>
    <div class="val" id="v-aq">--<span class="unit">AQ</span></div>
  </div>
  <div class="sensor-card">
    <div class="lbl">Occupancy</div>
    <span class="occ-badge empty" id="occ-badge">Empty</span>
  </div>
  <div class="sensor-card">
    <div class="lbl">Door</div>
    <span class="occ-badge empty" id="door-badge">Closed</span>
    <div class="door-timer" id="door-timer"></div>
  </div>
</div>

<!-- Control panel -->
<div class="ctrl-panel">
  <div class="ctrl-header">
    <span>Device controls</span>
    <span class="mode-pill auto" id="mode-pill">Auto — sensors decide</span>
  </div>
  <div class="device-grid">

    <!-- Fan -->
    <div class="device-card" id="dc-fan">
      <div>
        <div class="device-name-row"><span class="led-dot" id="led-fan"></span><span class="device-name">Fan</span></div>
        <div class="device-state" id="ds-fan">OFF</div>
      </div>
      <label class="toggle-wrap disabled" id="tw-fan">
        <input type="checkbox" id="cb-fan" disabled
               onchange="sendDevice('fan', this.checked)">
        <div class="toggle-track"></div>
      </label>
    </div>

    <!-- Light -->
    <div class="device-card" id="dc-light" style="display:none;">
      <div>
        <div class="device-name-row"><span class="led-dot" id="led-light"></span><span class="device-name">Light</span></div>
        <div class="device-state" id="ds-light">OFF</div>
      </div>
      <label class="toggle-wrap disabled" id="tw-light">
        <input type="checkbox" id="cb-light" disabled
               onchange="sendDevice('light', this.checked)">
        <div class="toggle-track"></div>
      </label>
    </div>

    <!-- Buzzer -->
    <div class="device-card" id="dc-buzzer">
      <div>
        <div class="device-name-row"><span class="led-dot" id="led-buzzer"></span><span class="device-name">Buzzer</span></div>
        <div class="device-state" id="ds-buzzer">OFF</div>
      </div>
      <label class="toggle-wrap disabled" id="tw-buzzer">
        <input type="checkbox" id="cb-buzzer" disabled
               onchange="sendDevice('buzzer', this.checked)">
        <div class="toggle-track"></div>
      </label>
    </div>

    <!-- O2 Pump -->
    <div class="device-card" id="dc-pump">
      <div>
        <div class="device-name-row"><span class="led-dot" id="led-pump"></span><span class="device-name">O2 Pump</span></div>
        <div class="device-state" id="ds-pump">OFF</div>
      </div>
      <label class="toggle-wrap disabled" id="tw-pump">
        <input type="checkbox" id="cb-pump" disabled
               onchange="sendDevice('pump', this.checked)">
        <div class="toggle-track"></div>
      </label>
    </div>

  </div>

  <!-- Door override (works regardless of auto/manual mode). "Open" actuates
       the servo and arms auto-reverse-on-physical-close + the 30s alarm.
       "Close now" is a manual emergency override at any time. -->
  <div class="door-override-row">
    <span class="lbl-inline">Door override</span>
    <button class="mode-btn auto" onclick="triggerDoor('doorClose')">Close now</button>
    <button class="mode-btn manual" onclick="triggerDoor('doorOpen')">Open door</button>
  </div>
</div>

<!-- Charts -->
<div class="chart-row">
  <div class="chart-card">
    <h2>Temperature &amp; humidity</h2>
    <canvas id="envChart"></canvas>
  </div>
  <div class="chart-card">
    <h2>Air quality</h2>
    <canvas id="aqChart"></canvas>
  </div>
</div>

<script>
const socket = io();
let currentMode = 'auto';
const MAX_PTS   = 30;

// ── Charts ─────────────────────────────────────────────────────────
const BASE_OPTS = {
  responsive: true, animation: false,
  plugins: { legend: { labels: { color: '#65656f', boxWidth: 10, font: { family: 'IBM Plex Mono', size: 11 } } } },
  scales: {
    x: { ticks: { color: '#3d3d45', maxTicksLimit: 6, font: { family: 'IBM Plex Mono', size: 10 } }, grid: { color: '#1a1c22' } },
    y: { ticks: { color: '#3d3d45', font: { family: 'IBM Plex Mono', size: 10 } }, grid: { color: '#1a1c22' } },
  },
};

const envChart = new Chart(document.getElementById('envChart'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Temp (°C)',    data: [], borderColor: '#f97316', backgroundColor: 'transparent', tension: 0.35, pointRadius: 2 },
      { label: 'Humidity (%)', data: [], borderColor: '#38bdf8', backgroundColor: 'transparent', tension: 0.35, pointRadius: 2 },
    ],
  },
  options: BASE_OPTS,
});

const aqChart = new Chart(document.getElementById('aqChart'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Air quality', data: [], borderColor: '#a78bfa',
        backgroundColor: 'rgba(167,139,250,0.07)', tension: 0.35, pointRadius: 2, fill: true },
    ],
  },
  options: BASE_OPTS,
});

function pushChart(chart, label, ...vals) {
  chart.data.labels.push(label);
  if (chart.data.labels.length > MAX_PTS) chart.data.labels.shift();
  vals.forEach((v, i) => {
    chart.data.datasets[i].data.push(v);
    if (chart.data.datasets[i].data.length > MAX_PTS) chart.data.datasets[i].data.shift();
  });
  chart.update();
}

// ── Sensor reading ──────────────────────────────────────────────────
function applyReading(d) {
  // Cards
  document.getElementById('v-temp').innerHTML = `${d.temp.toFixed(1)}<span class="unit">°C</span>`;
  document.getElementById('v-hum').innerHTML  = `${d.humidity.toFixed(1)}<span class="unit">%</span>`;
  document.getElementById('v-aq').innerHTML   = `${d.aq}<span class="unit">AQ</span>`;

  const badge = document.getElementById('occ-badge');
  badge.textContent = d.occupied ? 'Occupied' : 'Empty';
  badge.className   = 'occ-badge ' + (d.occupied ? 'occupied' : 'empty');

  const doorBadge = document.getElementById('door-badge');
  const doorTimer = document.getElementById('door-timer');
  if (d.doorAlarm) {
    doorBadge.textContent = 'Open';
    doorBadge.className   = 'occ-badge alarm';
    doorTimer.textContent = `🚨 Open ${d.doorOpenSec}s — alarm active`;
    doorTimer.className   = 'door-timer alarm';
  } else if (d.doorOpen) {
    doorBadge.textContent = 'Open';
    doorBadge.className   = 'occ-badge occupied';
    doorTimer.textContent = `Open ${d.doorOpenSec}s`;
    doorTimer.className   = 'door-timer';
  } else {
    doorBadge.textContent = 'Closed';
    doorBadge.className   = 'occ-badge empty';
    doorTimer.textContent = '';
    doorTimer.className   = 'door-timer';
  }

  // Live indicator
  const dot = document.getElementById('live-dot');
  dot.classList.remove('offline');
  document.getElementById('live-label').textContent =
    'Live · ' + new Date(d.time).toLocaleTimeString();

  // Alert banner
  const banner = document.getElementById('alert-banner');
  const alerts = [];
  if (d.temp     > 30)  alerts.push(`High temp ${d.temp.toFixed(1)}°C`);
  if (d.humidity > 80)  alerts.push(`High humidity ${d.humidity.toFixed(1)}%`);
  if (d.aq       > 600) alerts.push(`Poor air quality (${d.aq})`);
  if (alerts.length) {
    banner.textContent = '⚠ ' + alerts.join(' · ');
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }

  // Charts
  const t = new Date(d.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  pushChart(envChart, t, d.temp, d.humidity);
  pushChart(aqChart,  t, d.aq);
}

// ── Command state ───────────────────────────────────────────────────
function applyCommandState(state) {
  currentMode = state.mode;
  const isManual = (currentMode === 'manual');

  // Header button
  const btn = document.getElementById('mode-btn');
  btn.textContent = isManual ? 'Manual mode' : 'Auto mode';
  btn.className   = 'mode-btn ' + currentMode;

  // Pill
  const pill = document.getElementById('mode-pill');
  pill.textContent = isManual ? 'Manual — you control devices' : 'Auto — sensors decide';
  pill.className   = 'mode-pill ' + currentMode;

  // Each device
  ['fan', 'light', 'buzzer', 'pump'].forEach(dev => {
    const on  = !!state.commands[dev];
    const cb  = document.getElementById('cb-' + dev);
    const tw  = document.getElementById('tw-' + dev);
    const dc  = document.getElementById('dc-' + dev);
    const ds  = document.getElementById('ds-' + dev);
    const led = document.getElementById('led-' + dev);

    // Don't fire onchange when we programmatically set checked
    cb.onchange = null;
    cb.checked  = on;
    cb.disabled = !isManual;
    cb.onchange = () => sendDevice(dev, cb.checked);

    tw.className  = 'toggle-wrap' + (isManual ? '' : ' disabled');
    dc.className  = 'device-card' + (on ? ' is-on' : '');
    ds.textContent = on ? 'ON' : 'OFF';
    ds.className  = 'device-state' + (on ? ' on' : '');
    led.className = 'led-dot' + (on ? ' on' : '');
  });
}

// ── Commands from browser ───────────────────────────────────────────
function toggleMode() {
  const next = currentMode === 'auto' ? 'manual' : 'auto';
  socket.emit('setCommand', { mode: next });
}

function sendDevice(device, value) {
  if (currentMode !== 'manual') return;
  socket.emit('setCommand', { device, value });
}

// Door override works regardless of auto/manual mode — it's a one-shot
// servo action, not a persistent toggle like fan/light/buzzer/pump.
function triggerDoor(action) {
  socket.emit('setCommand', { device: action, value: true });
}

// ── Socket events ───────────────────────────────────────────────────
socket.on('reading',      applyReading);
socket.on('commandState', applyCommandState);

socket.on('disconnect', () => {
  document.getElementById('live-dot').classList.add('offline');
  document.getElementById('live-label').textContent = 'Disconnected…';
});

// ── Load initial data ───────────────────────────────────────────────
fetch('/api/history')
  .then(r => r.json())
  .then(data => data.forEach(applyReading))
  .catch(() => {});

fetch('/api/commands')
  .then(r => r.json())
  .then(applyCommandState)
  .catch(() => {});
</script>
</body>
</html>
